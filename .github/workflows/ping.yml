# Резервный пингер: раз в 10 минут будит инстанс Vercel (health-check).
# Задайте переменную репозитория APP_URL (Settings -> Secrets and variables ->
# Actions -> Variables), например https://massage-bot.vercel.app
name: keepalive-ping
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -n "${{ vars.APP_URL }}" ]; then
            curl -fsS --max-time 15 "${{ vars.APP_URL }}/api/health" || true
          fi
